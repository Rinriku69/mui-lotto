<div class="mb-2 flex items-baseline justify-between">
  <span class="text-[13px] font-semibold">{{ label() }}</span>
  <span class="font-mono text-[11px] text-muted">{{ stats().total | number }}</span>
</div>

<div
  class="grid grid-cols-[12px_repeat(6,minmax(0,1fr))] gap-[3px] font-mono text-[10px] text-muted"
  role="grid"
  [attr.aria-label]="'ความถี่ตัวเลขแยกตามหลัก ' + label()"
  (pointerleave)="inspect.emit(null)"
>
  <span aria-hidden="true"></span>
  @for (p of positions; track p) {
    <span class="grid place-items-center" aria-hidden="true">{{ p }}</span>
  }
  @for (row of rows(); track $index) {
    <span class="grid place-items-center" aria-hidden="true">{{ $index }}</span>
    @for (c of row; track c.cell.pos) {
      <button
        type="button"
        class="aspect-[11/10] cursor-crosshair rounded-[3px] transition-shadow focus-visible:outline-none focus-visible:inset-ring-2 focus-visible:inset-ring-ink"
        [class]="c.flagged && active() !== c.cell ? 'inset-ring-[1.5px] inset-ring-gold' : active() === c.cell ? 'inset-ring-2 inset-ring-ink' : ''"
        [style]="c.style"
        [attr.aria-label]="c.aria"
        (pointerenter)="inspect.emit(c.cell)"
        (focus)="inspect.emit(c.cell)"
        (blur)="inspect.emit(null)"
      ></button>
    }
  }
</div>
